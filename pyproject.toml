[tool.poetry]
name = "agentic-ai-bot"
version = "0.1.0"
description = "Agentic AI Bot for Parent Outreach and Student Engagement"
authors = ["AI Engineer"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
python-dotenv = "^1.0.1"
langchain = "^0.2.0"
langchain-openai = "^0.1.8"
langgraph = "^0.2.0"
langchain-core = "^0.2.0"
gspread = "^6.1.0"
google-auth = "^2.30.0"
google-auth-oauthlib = "^1.2.0"
httpx = "^0.27.0"
tenacity = "^8.3.0"
pytz = "^2024.1"
python-telegram-bot = "^21.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
